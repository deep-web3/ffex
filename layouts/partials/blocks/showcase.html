{{- $b := .b -}}
<section class="block block--showcase"{{ with $b.id }} id="{{ . }}"{{ end }}>
  <div class="container">
    {{ partial "block-head.html" (dict "b" $b) }}
    <div class="showcase" data-showcase>
      <div class="showcase__tabs" role="tablist" aria-label="Demo previews">
        {{- range $i, $it := $b.items }}
        {{- $id := $it.id | default (printf "demo-%d" $i) }}
        <button class="showcase__tab{{ if eq $i 0 }} is-active{{ end }}" type="button" role="tab" id="tab-{{ $id }}" aria-controls="panel-{{ $id }}" aria-selected="{{ if eq $i 0 }}true{{ else }}false{{ end }}" tabindex="{{ if eq $i 0 }}0{{ else }}-1{{ end }}" data-showcase-tab="{{ $i }}">
          <span class="showcase__tab-num">{{ printf "%02d" (add $i 1) }}</span>
          <span class="showcase__tab-label">{{ $it.tab | default $it.title }}</span>
        </button>
        {{- end }}
      </div>

      <div class="showcase__stage">
        {{- range $i, $it := $b.items }}
        {{- $id := $it.id | default (printf "demo-%d" $i) }}
        <div class="showcase__panel{{ if eq $i 0 }} is-active{{ end }}" role="tabpanel" id="panel-{{ $id }}" aria-labelledby="tab-{{ $id }}" data-showcase-panel="{{ $i }}"{{ if ne $i 0 }} hidden{{ end }}>
          <figure class="demo">
            <div class="demo__frame">
              <video class="demo__video" data-demo-video muted loop playsinline preload="none" poster="{{ $it.poster | relURL }}" aria-label="{{ $it.title }}">
                {{- with $it.video }}<source src="{{ . | relURL }}" type="video/webm">{{ end }}
                {{- with $it.mp4 }}<source src="{{ . | relURL }}" type="video/mp4">{{ end }}
              </video>
              <button class="demo__toggle" type="button" data-video-toggle aria-label="{{ i18n "video_pause" }}">
                <span class="demo__toggle-icon demo__toggle-icon--pause">{{ partial "icon.html" "pause" }}</span>
                <span class="demo__toggle-icon demo__toggle-icon--play">{{ partial "icon.html" "play" }}</span>
              </button>
            </div>
            <figcaption class="demo__caption">
              <div class="demo__caption-head">
                <span class="demo__caption-tag">{{ $it.tag | default "INTERFACE PREVIEW" }}</span>
                <span class="demo__chip demo__chip--inline">{{ i18n "demo_badge" }}</span>
              </div>
              <h3 class="demo__title">{{ $it.title }}</h3>
              <p class="demo__desc">{{ $it.desc }}</p>
              {{- with $it.bullets }}
              <ul class="demo__bullets">
                {{- range . }}<li>{{ . }}</li>{{ end }}
              </ul>
              {{- end }}
            </figcaption>
          </figure>
        </div>
        {{- end }}
      </div>
    </div>
    {{- with $b.note }}<p class="block-note">{{ . }}</p>{{ end }}
  </div>
</section>
