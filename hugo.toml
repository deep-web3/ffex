# ffex — buyer-facing site for the ffex exchange platform.
# Stack: Hugo (pinned 0.168.0 extended, see .github/workflows/deploy.yml) +
# a custom theme in layouts/, deployed to GitHub Pages on every push to main.
# Structure, block schema and content rules: DESIGN.md.

baseURL = "https://deep-web3.github.io/ffex/"
title = "ffex — Exchange platform engineering"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = false
disableHugoGeneratorInject = true

[pagination]
  pagerSize = 24

[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false

[params]
  description = "A complete digital-asset exchange platform, implemented twice — Java and Go — on one contract-first blueprint. Trading, custody, risk, market data, frontends and full-link observability, delivered as source you can own."
  siteRepo = "https://github.com/deep-web3/ffex"
  contactTelegram = "https://t.me/bitdevops"
  contactTelegramLabel = "@bitdevops"
  contactEmail = "horizonvideo@gmail.com"
  ogImage = "og/ffex-og-en.png"

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "ffex — Exchange platform engineering"

    [languages.en.params]
      description = "A complete digital-asset exchange platform, implemented twice — Java and Go — on one contract-first blueprint. Trading, custody, risk, market data, frontends and full-link observability, delivered as source you can own."
      ogImage = "og/ffex-og-en.png"

  [languages.zh]
    label = "中文"
    locale = "zh-CN"
    contentDir = "content/zh"
    weight = 2
    title = "ffex — 交易所平台工程"

    [languages.zh.params]
      description = "一套完整的数字资产交易所平台，以 Java 与 Go 两套实现构建于同一份契约优先蓝图之上——交易、托管、风控、行情、前端与全链路可观测，以可真正拥有的源码交付。"
      ogImage = "og/ffex-og-zh.png"
