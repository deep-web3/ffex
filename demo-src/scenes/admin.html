<!doctype html>
<html lang="zh-CN" data-scene="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>ffex demo · admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="base.css">
<style>
  .admin-grid { grid-template-columns: 696px 682px; }
  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  /* ---------------- KPI tiles ---------------- */
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: 132px; flex: none; }
  .kpi-tile { border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; position: relative; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .kpi-tile .kt-k { font: 7.5px var(--mono); letter-spacing: 0.17em; color: var(--faint); }
  .kpi-tile .kt-v { margin-top: 6px; font: 500 25px/1 var(--disp); letter-spacing: -0.02em; color: #f2f4fb; display: flex; align-items: baseline; gap: 6px; }
  .kpi-tile .kt-v small { font: 8px var(--mono); letter-spacing: 0.06em; color: var(--dim); }
  .kpi-tile .kt-f { margin-top: 6px; display: flex; align-items: center; gap: 6px; font: 7.5px var(--mono); color: var(--dim); letter-spacing: 0.04em; }
  .kpi-tile .kt-spark { position: absolute; right: 10px; bottom: 10px; }
  .kpi-tile.tint-violet { border-color: rgba(139,108,255,.2); }
  .kpi-tile.tint-cyan { border-color: rgba(46,230,197,.18); }
  .kpi-tile.tint-amber { border-color: rgba(255,180,92,.2); }

  /* ---------------- exposure ---------------- */
  .exposure-panel { height: 330px; flex: none; }
  .exp-body { position: absolute; left: 0; right: 0; top: 0; bottom: 44px; padding: 12px 16px; display: flex; gap: 16px; }
  .exp-foot { position: absolute; left: 16px; right: 16px; bottom: 12px; height: 32px; display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,.055); padding-top: 9px; }
  .exp-foot .ef { font: 7px var(--mono); letter-spacing: .1em; color: var(--faint); }
  .exp-foot .ef b { color: #c3c8da; font-weight: 500; letter-spacing: .02em; margin-left: 5px; }
  .gauge-wrap { position: relative; width: 178px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .gauge-center { position: absolute; top: 46px; left: 14px; width: 150px; text-align: center; }
  .gauge-label { font: 7px var(--mono); letter-spacing: 0.16em; color: var(--faint); }
  .gauge-sub { font: 8px var(--mono); color: var(--dim); letter-spacing: 0.04em; }
  .exp-bars { flex: 1; display: flex; flex-direction: column; gap: 9px; justify-content: center; }
  .exp-row { display: flex; flex-direction: column; gap: 4px; }
  .exp-row .er-top { display: flex; align-items: baseline; justify-content: space-between; font: 9px var(--mono); color: #c9cede; letter-spacing: 0.03em; }
  .exp-row .er-top .pct { color: #dfe2ee; }
  .exp-row .er-top .amt { color: var(--dim); font-size: 8px; margin-left: 7px; }
  .util-line { display: flex; align-items: center; justify-content: space-between; margin-top: 3px; font: 7.5px var(--mono); color: var(--faint); }
  .small-bars { display: flex; align-items: flex-end; gap: 3px; height: 26px; margin-top: 4px; }
  .small-bars i { width: 6px; border-radius: 1.5px; background: linear-gradient(180deg, rgba(139,108,255,.9), rgba(139,108,255,.2)); }

  /* ---------------- alerts ---------------- */
  .alerts-panel { flex: 1; }
  .alert-head { display: grid; grid-template-columns: 74px 1fr 74px 82px; padding: 0 14px; height: 20px; align-items: center; font: 7px var(--mono); letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.045); }
  .alert-row { display: grid; grid-template-columns: 74px 1fr 74px 82px; align-items: center; height: 34px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.028); font: 8.5px var(--mono); }
  .alert-row .an { color: #c3c8da; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alert-row .at { color: var(--faint); font-size: 7.5px; }
  .alert-row .as { text-align: right; }
  .alert-row.flash { background: rgba(255, 180, 92, 0.06); }

  /* ---------------- withdrawal queue ---------------- */
  .queue-panel { height: 400px; flex: none; }
  .q-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,.045); flex: none; }
  .wq-row { position: relative; display: grid; grid-template-columns: 1fr 122px 130px; gap: 16px; align-items: center; height: 64px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.032); }
  .wq-row .wq-id { font: 9px var(--mono); color: #d6d9e6; letter-spacing: 0.02em; }
  .wq-row .wq-sub { margin-top: 3px; font: 7.5px var(--mono); color: var(--faint); letter-spacing: 0.04em; }
  .wq-row .wq-amt { text-align: right; font: 500 13px var(--disp); color: #f0f2fa; letter-spacing: -0.01em; }
  .wq-row .wq-amt small { display: block; font: 7px var(--mono); color: var(--faint); letter-spacing: 0.06em; margin-top: 2px; }
  .wq-row .wq-st { display: flex; justify-content: flex-end; gap: 5px; }
  .wq-row.sel { background: linear-gradient(90deg, rgba(139,108,255,.13), rgba(139,108,255,.02)); }
  .wq-row.sel::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--violet); box-shadow: 0 0 10px rgba(139,108,255,.8); }
  .wq-row.approved { background: rgba(200,255,98,.05); }
  .wq-row.approved::before { background: var(--lime); box-shadow: 0 0 10px rgba(200,255,98,.8); }
  .q-foot { margin-top: auto; padding: 9px 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }

  /* ---------------- audit ---------------- */
  .audit-panel { flex: 1; }
  .audit-body { position: absolute; left: 0; right: 0; top: 20px; bottom: 0; overflow: hidden; }
  .audit-head { position: absolute; top: 0; left: 0; right: 0; height: 20px; display: grid; grid-template-columns: 78px 1fr 92px; padding: 0 14px; align-items: center; font: 7px var(--mono); letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.045); }
  .audit-row { position: absolute; left: 0; right: 0; top: 0; height: 34px; display: grid; grid-template-columns: 78px 1fr 92px; align-items: center; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.026); font: 8px var(--mono); }
  .audit-row .au-t { color: var(--faint); font-size: 7.5px; }
  .audit-row .au-a { color: #b9bfd2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audit-row .au-w { color: var(--faint); font-size: 7px; text-align: right; letter-spacing: 0.04em; }

  /* ---------------- modal ---------------- */
  .modal-backdrop { opacity: 0; pointer-events: none; }
  .totp-boxes { display: flex; gap: 8px; justify-content: center; margin: 14px 0 10px; }
  .totp-box { width: 46px; height: 56px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(4,6,13,.55); display: grid; place-items: center; font: 500 24px/1 var(--disp); color: #f4f5fc; }
  .totp-box.filled { border-color: rgba(139,108,255,.55); background: rgba(139,108,255,.1); box-shadow: 0 0 18px rgba(139,108,255,.18); }
  .totp-box.active { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(46,230,197,.5), 0 0 22px rgba(46,230,197,.25); }
  .totp-meta { display: flex; align-items: center; justify-content: center; gap: 10px; font: 8px var(--mono); letter-spacing: 0.08em; color: var(--faint); }
  .totp-ring { width: 16px; height: 16px; }
  .w-summary { border-radius: 12px; border: 1px solid rgba(255,255,255,.07); background: rgba(4,6,13,.4); padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
  .w-summary .ws-amt { font: 500 22px/1 var(--disp); color: #f2f4fb; letter-spacing: -0.02em; }
  .w-summary .ws-amt small { font: 9px var(--mono); color: var(--faint); letter-spacing: 0.06em; }
  .w-summary .ws-meta { margin-left: auto; text-align: right; font: 8px var(--mono); color: var(--faint); line-height: 1.7; }
  .w-summary .ws-meta b { color: #c3c8da; font-weight: 500; }
  .mfa-note { margin-top: 10px; font: 8.5px var(--sans); color: var(--dim); line-height: 1.5; }
</style>
</head>
<body>
<script src="lib.js"></script>
<script src="admin.js"></script>
</body>
</html>
