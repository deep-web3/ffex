<!doctype html>
<html lang="zh-CN" data-scene="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>ffex demo · terminal</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="base.css">
<style>
  .terminal-grid { grid-template-columns: 918px 460px; }
  .col-left { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .chart-panel { height: 456px; flex: none; }

  /* chart */
  .chart-wrap { position: absolute; inset: 0; }
  #chart { display: block; width: 100%; height: 100%; }
  .chart-overlay { position: absolute; inset: 0; pointer-events: none; }
  .sym-badge { width: 21px; height: 21px; border-radius: 6px; display: grid; place-items: center; font: 700 11px var(--mono); color: var(--amber); background: rgba(240,185,11, 0.12); border: 1px solid rgba(240,185,11, 0.26); }
  .sym-name { font: 600 10px var(--mono); letter-spacing: 0.14em; color: #e8eaf4; }
  .chart-panel .panel-hd { gap: 8px; }
  .chart-panel .panel-aux { gap: 6px; }
  .px-block { position: absolute; left: 17px; top: 12px; }
  .px-sym { font: 600 9px var(--mono); letter-spacing: 0.19em; color: var(--muted); }
  .px-sym em { font-style: normal; color: var(--faint); }
  .px-big { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
  .px-big .val { font: 500 32px/1 var(--disp); letter-spacing: -0.03em; color: #f6f7fd; }
  .px-delta { font: 500 10.5px/1 var(--mono); letter-spacing: 0.03em; padding: 4px 7px; border-radius: 5px; }
  .px-delta.pos { color: var(--lime); background: rgba(14,203,129, 0.1); }
  .px-delta.neg { color: var(--rose); background: rgba(246,70,93, 0.1); }
  .ohlc { display: flex; gap: 10px; margin-top: 7px; font: 9px var(--mono); letter-spacing: 0.02em; color: var(--faint); }
  .ohlc b { font-weight: 500; color: #848e9c; }
  .chart-aux { position: absolute; right: 15px; top: 13px; display: flex; align-items: center; gap: 6px; }
  .feed-chip { display: inline-flex; align-items: center; gap: 6px; font: 600 9px var(--mono); letter-spacing: 0.14em; color: #ffe9a3; }
  .feed-chip i { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  /* fill toast */
  .fill-toast {
    position: absolute; right: 15px; top: 44px; width: 322px;
    display: flex; align-items: center; gap: 11px;
    padding: 12px 13px; border-radius: 13px;
    border: 1px solid rgba(14,203,129, 0.32);
    background: linear-gradient(180deg, rgba(14,40,30, 0.96), rgba(6,16,12, 0.97));
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 40px rgba(14,203,129, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    opacity: 0; transform: translate3d(0, -8px, 0);
  }
  .fill-toast .ft-icon { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #04140d; background: linear-gradient(135deg, #9fe8c8, #0ecb81); font-size: 14px; font-weight: 700; }
  .fill-toast .ft-title { font: 600 11.5px var(--sans); color: #d7f9ec; }
  .fill-toast .ft-sub { margin-top: 2px; font: 9.5px var(--mono); color: rgba(201,247,229, 0.72); letter-spacing: 0.02em; }
  .fill-toast .ft-bar { position: absolute; left: 12px; right: 12px; bottom: 6px; height: 2px; border-radius: 2px; background: rgba(14,203,129, 0.12); overflow: hidden; }
  .fill-toast .ft-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--lime), var(--cyan)); transform-origin: left center; }

  /* bottom row */
  .row-bottom { display: grid; grid-template-columns: 332px 572px; gap: 14px; height: 258px; flex: none; }
  .order-form { display: flex; flex-direction: column; gap: 8px; padding: 11px 14px 12px; }
  .ofields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ofield label { display: block; font: 8px var(--mono); letter-spacing: 0.15em; color: var(--faint); text-transform: uppercase; margin-bottom: 4px; }
  .pct-row { display: flex; align-items: center; gap: 6px; }
  .pct-row .pct-lbl { font: 8.5px var(--mono); letter-spacing: 0.1em; color: var(--faint); }
  .pct-track { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.07); }
  .pct-track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: linear-gradient(90deg, rgba(240,185,11, 0.85), rgba(252,213,53, 0.85)); }
  .pct-track .knob { position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: #fff8e6; box-shadow: 0 0 10px rgba(240,185,11, 0.6); transform: translateX(-50%); }
  .mini-note { font: 8.5px var(--mono); letter-spacing: 0.05em; color: var(--faint); text-align: center; }

  /* positions */
  .pos-panel .panel-bd { display: flex; flex-direction: column; }
  .pos-table { display: flex; flex-direction: column; }
  .pos-row { display: grid; grid-template-columns: 142px 52px 64px 84px 84px 1fr; align-items: center; height: 27px; padding: 0 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.035); font: 9.5px var(--mono); color: #b9bfd2; }
  .pos-row.thead { height: 22px; font-size: 8px; letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
  .pos-row .r { text-align: right; }
  .side-pill { display: inline-flex; align-items: center; gap: 5px; font: 700 8.5px var(--mono); letter-spacing: 0.1em; padding: 2px 7px; border-radius: 4px; }
  .side-pill.long { color: var(--lime); background: rgba(14,203,129, 0.11); border: 1px solid rgba(14,203,129, 0.24); }
  .side-pill.short { color: var(--rose); background: rgba(246,70,93, 0.11); border: 1px solid rgba(246,70,93, 0.24); }
  .ord-block { margin-top: 6px; }
  .ord-row { display: grid; grid-template-columns: 138px 46px 118px 78px 62px 1fr; align-items: center; height: 23px; padding: 0 14px; font: 9.5px var(--mono); color: #b9bfd2; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
  .ord-row.thead { height: 20px; font-size: 8px; letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
  .ord-row .st { justify-self: end; }

  /* order book */
  .book-panel .panel-bd { display: flex; flex-direction: column; padding: 6px 0 8px; }
  .book-head { display: grid; grid-template-columns: 1fr 82px; padding: 0 14px 4px; font: 8px var(--mono); letter-spacing: 0.13em; color: var(--faint); text-transform: uppercase; }
  .book-head .r { text-align: right; }
  .book-row { position: relative; display: grid; grid-template-columns: 1fr 82px; align-items: center; height: 18px; padding: 0 14px; font: 10px var(--mono); }
  .book-row .p { position: relative; z-index: 1; letter-spacing: 0.01em; }
  .book-row .s { position: relative; z-index: 1; text-align: right; color: #848e9c; font-size: 9.5px; }
  .book-row .dep { position: absolute; top: 3px; bottom: 3px; right: 12px; border-radius: 2px; z-index: 0; }
  .book-row.ask .p { color: #f9b3bd; }
  .book-row.ask .dep { background: linear-gradient(270deg, rgba(246,70,93, 0.26), rgba(246,70,93, 0.04)); }
  .book-row.bid .p { color: #9fe8c8; }
  .book-row.bid .dep { background: linear-gradient(270deg, rgba(14,203,129, 0.24), rgba(14,203,129, 0.035)); }
  .book-row.near .p { color: #fff; }
  .book-row.near .s { color: #dfe3ee; }
  .spread { position: relative; margin: 4px 0; height: 32px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 0 14px; border-top: 1px solid rgba(255, 255, 255, 0.06); border-bottom: 1px solid rgba(255, 255, 255, 0.06); background: linear-gradient(90deg, rgba(14,203,129, 0.04), rgba(240,185,11, 0.05), rgba(246,70,93, 0.04)); }
  .spread .sp-lbl { font: 8px var(--mono); letter-spacing: 0.14em; color: var(--faint); }
  .spread .sp-v { font: 500 11px var(--mono); letter-spacing: 0.01em; margin-top: 1px; }
  .spread .mid { font: 500 15px var(--disp); color: #f2f4fb; letter-spacing: -0.01em; text-align: center; }
  .spread .mid span { display: block; font: 8px var(--mono); letter-spacing: 0.14em; color: var(--faint); text-align: center; margin-top: 1px; }
  .spread .right { text-align: right; }

  /* trades tape */
  .tape-body { position: absolute; inset: 0; overflow: hidden; }
  .tape-row { position: absolute; left: 0; right: 0; height: 21px; display: grid; grid-template-columns: 74px 1fr 76px; align-items: center; padding: 0 14px; font: 9.5px var(--mono); }
  .tape-row .tt { color: var(--faint); font-size: 8.5px; }
  .tape-row .tp { letter-spacing: 0.01em; display: flex; align-items: center; gap: 5px; }
  .tape-row .tp i { width: 4px; height: 4px; border-radius: 50%; flex: none; }
  .tape-row .ts { text-align: right; color: #848e9c; }
  .tape-row.buy .tp { color: #9fe8c8; }
  .tape-row.buy .tp i { background: var(--lime); box-shadow: 0 0 6px rgba(14,203,129, 0.8); }
  .tape-row.sell .tp { color: #f9b3bd; }
  .tape-row.sell .tp i { background: var(--rose); box-shadow: 0 0 6px rgba(246,70,93, 0.8); }

  /* balances */
  .bal-row { display: flex; align-items: baseline; justify-content: space-between; padding: 0 14px; height: 24px; font: 9.5px var(--mono); color: var(--muted); }
  .bal-row .v { color: #e6e8f2; font-size: 11px; }
  .bal-row .v.lime { color: var(--lime); }
  .margin-row { padding: 2px 14px 0; }
  .margin-row .lbl { display: flex; justify-content: space-between; font: 8.5px var(--mono); letter-spacing: 0.06em; color: var(--faint); margin-bottom: 5px; }
</style>
</head>
<body>
<script src="lib.js"></script>
<script src="terminal.js"></script>
</body>
</html>
